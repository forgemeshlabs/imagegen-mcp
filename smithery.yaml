startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - walletPrivateKey
    properties:
      walletPrivateKey:
        type: string
        description: >-
          Base wallet private key for x402 USDC micropayments.
          Use a dedicated low-balance wallet — not your primary wallet.
          $1 USDC covers ~3-10 images depending on tier.
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'forgemesh-imagegen'],
      env: {
        WALLET_PRIVATE_KEY: config.walletPrivateKey
      }
    })
  exampleConfig:
    walletPrivateKey: '0x...'
